<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>AMR Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12151A;
  --bg2:#0D0F13;
  --surface:#1B2029;
  --surface2:#232A35;
  --border:#2C3441;
  --steel:#8B98AA;
  --steel-dim:#5B6472;
  --forge:#FF6A3D;
  --forge-dim:#B84E2B;
  --forge-glow:rgba(255,106,61,.18);
  --olive:#8FBC6B;
  --olive-dim:#5F7F45;
  --gold:#E8B93F;
  --danger:#E15B5B;
  --text:#EDEEF0;
  --text-dim:#9AA3B1;
  --text-faint:#5B6472;
  --radius:14px;
  --radius-sm:9px;
  font-family:'Tajawal','Inter',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body{
  min-height:100vh;
  padding-bottom:40px;
  background:
    radial-gradient(circle at 15% 0%, rgba(255,106,61,.06), transparent 40%),
    radial-gradient(circle at 100% 20%, rgba(139,152,170,.05), transparent 45%),
    var(--bg);
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px;}
.mono{font-family:'JetBrains Mono',monospace;}
.display{font-family:'Oswald',sans-serif;}

/* Header */
header.top{padding:18px 16px 10px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(155deg,var(--forge),var(--forge-dim));display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 4px 14px var(--forge-glow);flex-shrink:0;}
.brand-text .t1{font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;letter-spacing:.3px;line-height:1.1;}
.brand-text .t2{font-size:11px;color:var(--text-faint);letter-spacing:.5px;}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--steel);cursor:pointer;}
.icon-btn:active{background:var(--surface2);}
.header-actions{display:flex;gap:8px;}

/* Day tabs */
.day-tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex-shrink:0;padding:9px 15px;border-radius:11px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);font-size:13.5px;font-weight:600;cursor:pointer;position:relative;white-space:nowrap;}
.day-tab .sub{display:block;font-size:9.5px;font-weight:500;color:var(--text-faint);margin-top:1px;}
.day-tab.active{background:var(--forge);border-color:var(--forge);color:#1a0d06;}
.day-tab.active .sub{color:rgba(20,10,5,.65);}
.day-tab.today::after{content:'';position:absolute;top:-3px;left:50%;transform:translateX(50%);width:5px;height:5px;border-radius:50%;background:var(--olive);}

/* Section header */
.workout-head{margin:18px 0 12px;padding:16px;border-radius:var(--radius);background:linear-gradient(135deg,var(--surface2),var(--surface));border:1px solid var(--border);}
.workout-head .label{font-size:11px;color:var(--forge);font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.workout-head h1{font-family:'Oswald',sans-serif;font-size:22px;margin:4px 0 0;font-weight:600;}
.workout-head .meta{font-size:12.5px;color:var(--text-dim);margin-top:4px;}

/* Quick stats row */
.quickrow{display:flex;gap:8px;margin-bottom:16px;}
.quick-chip{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 10px;text-align:center;}
.quick-chip label{display:block;font-size:10px;color:var(--text-faint);margin-bottom:2px;}
.quick-chip input{width:100%;background:none;border:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;text-align:center;outline:none;}

/* Exercise cards */
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.ex-top{padding:14px 15px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.ex-name{font-weight:700;font-size:15.5px;}
.ex-sub{font-size:12px;color:var(--text-dim);margin-top:2px;font-family:'JetBrains Mono',monospace;}
.ex-badge{width:36px;height:36px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.variant-row{display:flex;gap:6px;padding:0 15px 10px;flex-wrap:wrap;}
.variant-chip{font-size:11.5px;padding:6px 11px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text-dim);cursor:pointer;font-weight:600;}
.variant-chip.active{background:var(--forge);border-color:var(--forge);color:#1a0d06;}
.variant-chip.disabled{opacity:.35;pointer-events:none;}
.ex-cue{margin:0 15px 12px;padding:10px 12px;background:var(--bg2);border-radius:10px;font-size:12.5px;color:var(--text-dim);line-height:1.5;}
.ex-cue a{color:var(--forge);text-decoration:none;font-weight:600;}
.inputs-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:0 15px 12px;}
.field{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center;}
.field label{display:block;font-size:9.5px;color:var(--text-faint);font-weight:600;letter-spacing:.5px;}
.field input{width:100%;background:none;border:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;text-align:center;outline:none;}
.log-btn{margin:0 15px 15px;padding:11px;border-radius:10px;background:var(--olive);color:#0d1a08;font-weight:700;font-size:14px;text-align:center;border:none;width:calc(100% - 30px);cursor:pointer;}
.log-btn:active{background:var(--olive-dim);}
.log-btn.logged{background:var(--surface2);color:var(--olive);border:1px solid var(--olive-dim);}

/* Section dividers */
.section-title{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;color:var(--steel);letter-spacing:.5px;margin:22px 2px 10px;display:flex;align-items:center;gap:8px;}
.section-title::before{content:'';width:3px;height:14px;background:var(--forge);border-radius:2px;}

/* Core picker */
.core-picker{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none;}
.core-picker::-webkit-scrollbar{display:none;}
.core-opt{flex-shrink:0;padding:8px 13px;border-radius:20px;background:var(--surface);border:1px solid var(--border);font-size:12.5px;color:var(--text-dim);cursor:pointer;font-weight:600;white-space:nowrap;}
.core-opt.selected{background:var(--gold);border-color:var(--gold);color:#241a02;}

/* Cardio */
.cardio-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.cardio-opt{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 10px;text-align:center;cursor:pointer;}
.cardio-opt .ic{font-size:22px;margin-bottom:4px;}
.cardio-opt .nm{font-size:12.5px;font-weight:700;}
.cardio-opt.selected{border-color:var(--forge);background:var(--forge-glow);}

/* Logged entries list */
.logged-list{margin-top:6px;}
.logged-item{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:7px;font-size:12.5px;}
.logged-item .li-name{font-weight:700;}
.logged-item .li-data{color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:11.5px;}
.li-del{color:var(--danger);font-size:16px;cursor:pointer;padding:2px 6px;}

/* Report */
.report-btn{width:100%;padding:14px;border-radius:var(--radius);background:linear-gradient(135deg,var(--forge),var(--forge-dim));border:none;color:#fff;font-weight:700;font-size:14.5px;margin-top:26px;cursor:pointer;box-shadow:0 6px 20px var(--forge-glow);}
.report-box{margin-top:14px;padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:11.5px;white-space:pre-wrap;line-height:1.7;direction:ltr;text-align:left;color:var(--text-dim);}
.copy-btn{margin-top:10px;width:100%;padding:11px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:50;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 18px 28px;width:100%;max-width:640px;max-height:82vh;overflow-y:auto;}
.modal h2{font-family:'Oswald',sans-serif;font-size:19px;margin:0 0 4px;}
.modal .hint{font-size:12px;color:var(--text-faint);margin-bottom:16px;}
.sched-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
.sched-row:last-of-type{border-bottom:none;}
.sched-row .dname{font-weight:700;font-size:14px;}
.sched-row select{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:600;font-family:inherit;}
.modal-close{margin-top:16px;width:100%;padding:12px;border-radius:10px;background:var(--forge);border:none;color:#1a0d06;font-weight:700;cursor:pointer;}

.weight-tracker{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.stepper{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;flex:1;}
.stepper button{background:none;border:none;color:var(--forge);font-size:19px;font-weight:700;padding:9px 14px;cursor:pointer;}
.stepper .val{flex:1;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;}
.stepper label{position:absolute;}
</style>
</head>

  {id:'plank',name:'Plank',machineAlt:null,bwAlt:null,timer:true,sets:2,reps:'1min',weight:0,rpe:7,cue:'جسمك خط مستقيم من الرأس للقدم، شد البطن طول الوقت'},
  {id:'hlr',name:'Hanging Leg Raise',machineAlt:'Total Abdominal Machine',bwAlt:'Lying Leg Raise',sets:3,reps:12,weight:0,rpe:7,cue:'اتعلق من البار وارفع الرجلين لأعلى بتحكم بدون تأرجح'},
  {id:'rtwist',name:'Russian Twist',machineAlt:null,bwAlt:null,sets:3,reps:30,weight:10,rpe:7,cue:'اجلس منحني للخلف شوية ولف الجذع يمين شمال'},
  {id:'crossover',name:'Crossover Crunch',machineAlt:null,bwAlt:null,sets:3,reps:24,weight:0,rpe:7,cue:'كرنش مع لفة، كوعك يلمس الركبة المعاكسة'},
  {id:'heel',name:'Heel Touch',machineAlt:null,bwAlt:null,sets:3,reps:30,weight:0,rpe:7,cue:'استلقِ وثبّت البطن، المس كعبك يمين وشمال بالتبادل'},
  {id:'mclimb',name:'Mountain Climber',machineAlt:null,bwAlt:null,sets:3,reps:30,weight:0,rpe:7,cue:'وضع بلانك، اجذب الركبة للصدر بالتبادل بسرعة متحكم فيها'},
  {id:'totalab',name:'Total Abdominal',machineAlt:null,bwAlt:'Cable Crunch',sets:3,reps:20,weight:60,rpe:7,cue:'اجلس على الجهاز وادفع بالبطن للأمام لأسفل'}
];

const CARDIO_TYPES = [
  {id:'walk',name:'Walking (Incline)',icon:'🚶'},
  {id:'elliptical',name:'Elliptical',icon:'🌀'},
  {id:'stepper',name:'Stepper',icon:'🪜'},
  {id:'row',name:'Indoor Rowing',icon:'🚣'}
];

const DEFAULT_SCHEDULE = {sat:'upperFull',sun:'lowerFull',mon:'cardioOnly',tue:'upperFull',wed:'lowerFull',thu:'cardioOnly',fri:'rest'};
const STRENGTH_TYPES = ['chest','back','legs','arms','upperFull','lowerFull'];

/* ===================== STATE ===================== */
function load(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback;}catch(e){return fallback;}}
function save(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}

let schedule = load('amr_schedule', DEFAULT_SCHEDULE);
let variants = load('amr_variants', {}); // exId -> 'main'|'machine'|'bw'
let entries = load('amr_entries', {}); // dateStr -> [ {exId,name,variant,weight,reps,sets,rpe,cat} ]
let dayVals = load('amr_dayvals', {}); // dateStr -> {weight,water,sauna,steps}
let selectedCore = load('amr_selectedcore', {}); // dateStr -> [coreIds]
let selectedCardio = {}; // per-session transient selection

const todayKey = ()=> new Date().toISOString().slice(0,10);
let activeDayIndex = JS_WEEKDAY_TO_KEY[new Date().getDay()];
let viewedDate = todayKey();

/* ===================== HELPERS ===================== */
function ytLink(name){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' exercise how to');}
function getVariantName(ex){
  const v = variants[ex.id] || 'main';
  if(v==='machine' && ex.machineAlt) return ex.machineAlt;
  if(v==='bw' && ex.bwAlt) return ex.bwAlt;
  return ex.name;
}
function entriesFor(date){return entries[date]||[];}
function isLogged(date,exId,variant){return entriesFor(date).some(e=>e.exId===exId && e.variant===variant);}

/* ===================== RENDER ===================== */
function render(){
  const app = document.getElementById('app');
  const dayType = schedule[activeDayIndex];
  const meta = TYPE_META[dayType];
  const dv = dayVals[viewedDate] || {weight:'',water:0,sauna:'',steps:''};

  let html = '';
  html += renderHeader();
  html += renderDayTabs();
  html += `<div class="workout-head">
    <div class="label">${DAY_LABEL[activeDayIndex]}</div>
    <h1>${meta.icon} ${meta.name}</h1>
    <div class="meta">${meta.nameAr}</div>
  </div>`;

  html += `<div class="quickrow">
    <div class="quick-chip"><label>⚖️ الوزن kg</label><input type="number" step="0.1" value="${dv.weight}" onchange="setDayVal('weight',this.value)"></div>
    <div class="quick-chip"><label>💧 ماء (أكواب)</label><input type="number" value="${dv.water}" onchange="setDayVal('water',this.value)"></div>
    <div class="quick-chip"><label>🧖 سونا (د)</label><input type="number" value="${dv.sauna}" onchange="setDayVal('sauna',this.value)"></div>
  </div>
  <div class="quickrow">
    <div class="quick-chip"><label>👟 خطوات</label><input type="number" value="${dv.steps||''}" onchange="setDayVal('steps',this.value)"></div>
    <div class="quick-chip"><label>❤️ نبض</label><input type="number" value="${dv.hr||''}" onchange="setDayVal('hr',this.value)"></div>
  </div>`;

  if(STRENGTH_TYPES.includes(dayType)){
    html += `<div class="section-title">تمارين اليوم <span style="color:var(--text-faint);font-weight:500;font-size:11px;">(الحجم مبني على 10-20 سِت/عضلة أسبوعيًا)</span></div>`;
    EXLIB[dayType].forEach(ex=>{ html += renderExCard(ex); });
    html += renderCoreSection();
  }

  html += renderCardioSection();
  html += renderLoggedList();

  html += `<button class="report-btn" onclick="generateReport()">📊 توليد تقرير الأسبوع</button>
  <div id="reportBox"></div>`;

  app.innerHTML = html;
}

function renderHeader(){
  return `<header class="top">
    <div class="brand">
      <div class="brand-mark">🏋️</div>
      <div class="brand-text">
        <div class="t1">AMR FITNESS</div>
        <div class="t2">${viewedDate}</div>
      </div>
    </div>
    <div class="header-actions">
      <div class="icon-btn" onclick="openSettings()">⚙️</div>
    </div>
  </header>`;
}

function renderDayTabs(){
  let html = '<div class="day-tabs">';
  DAY_ORDER.forEach(d=>{
    const active = d===activeDayIndex ? 'active' : '';
    const isToday = JS_WEEKDAY_TO_KEY[new Date().getDay()]===d ? 'today' : '';
    const meta = TYPE_META[schedule[d]];
    html += `<div class="day-tab ${active} ${isToday}" onclick="switchDay('${d}')">${DAY_LABEL[d]}<span class="sub">${meta.icon} ${meta.name}</span></div>`;
  });
  html += '</div>';
  return html;
}

function renderExCard(ex){
  const v = variants[ex.id] || 'main';
  const displayName = getVariantName(ex);
  const logged = isLogged(viewedDate, ex.id, v);
  const stored = entriesFor(viewedDate).find(e=>e.exId===ex.id && e.variant===v);
  const w = stored ? stored.weight : ex.weight;
  const r = stored ? stored.reps : ex.reps;
  const s = stored ? stored.sets : ex.sets;
  const rp = stored ? stored.rpe : ex.rpe;

  let html = `<div class="ex-card">
    <div class="ex-top">
      <div>
        <div class="ex-name">${displayName}</div>
        <div class="ex-sub">${w}kg · RPE ${rp} @ ${r}×${s} ${ex.rest?'· 🕑 راحة '+ex.rest:''}</div>
      </div>
      <div class="ex-badge">🏋️</div>
    </div>
    <div class="variant-row">
      <div class="variant-chip ${v==='main'?'active':''}" onclick="setVariant('${ex.id}','main')">${ex.name}</div>
      <div class="variant-chip ${v==='machine'?'active':''} ${!ex.machineAlt?'disabled':''}" onclick="setVariant('${ex.id}','machine')">${ex.machineAlt||'—'}</div>
      <div class="variant-chip ${v==='bw'?'active':''} ${!ex.bwAlt?'disabled':''}" onclick="setVariant('${ex.id}','bw')">${ex.bwAlt||'—'}</div>
    </div>
    <div class="ex-cue">${ex.cue} · <a href="${ytLink(displayName)}" target="_blank">▶ شاهد الشرح</a></div>
    <div class="inputs-row">
      <div class="field"><label>RPE</label><input type="number" id="rpe_${ex.id}" value="${rp}"></div>
      <div class="field"><label>KG</label><input type="number" step="0.5" id="kg_${ex.id}" value="${w}"></div>
      <div class="field"><label>REPS</label><input type="number" id="reps_${ex.id}" value="${r}"></div>
      <div class="field"><label>SETS</label><input type="number" id="sets_${ex.id}" value="${s}"></div>
    </div>
    <button class="log-btn ${logged?'logged':''}" onclick="logExercise('${ex.id}','${displayName.replace(/'/g,"\\'")}')">${logged?'✅ متسجّل — عدّل واحفظ تاني':'سجّل التمرين'}</button>
  </div>`;
  return html;
}

function renderCoreSection(){
  const sel = selectedCore[viewedDate] || [];
  let html = `<div class="section-title">🔥 تمارين البطن (اختياري)</div><div class="core-picker">`;
  CORE_POOL.forEach(c=>{
    html += `<div class="core-opt ${sel.includes(c.id)?'selected':''}" onclick="toggleCore('${c.id}')">${c.name}</div>`;
  });
  html += `</div>`;
  sel.forEach(cid=>{
    const c = CORE_POOL.find(x=>x.id===cid);
    if(c) html += renderExCard(c);
  });
  return html;
}

function renderCardioSection(){
  const sel = selectedCardio[viewedDate];
  let html = `<div class="section-title">🚴 كارديو</div><div class="cardio-grid">`;
  CARDIO_TYPES.forEach(c=>{
    html += `<div class="cardio-opt ${sel===c.id?'selected':''}" onclick="selectCardio('${c.id}')"><div class="ic">${c.icon}</div><div class="nm">${c.name}</div></div>`;
  });
  html += `</div>`;
  if(sel){
    const c = CARDIO_TYPES.find(x=>x.id===sel);
    html += `<div class="ex-card">
      <div class="ex-top"><div class="ex-name">${c.icon} ${c.name}</div></div>
      <div class="inputs-row" style="grid-template-columns:1fr 1fr 1fr;">
        <div class="field"><label>دقايق</label><input type="number" id="cardio_dur"></div>
        <div class="field"><label>سعرات</label><input type="number" id="cardio_cal"></div>
        <div class="field"><label>مستوى/واط</label><input type="number" id="cardio_lvl"></div>
      </div>
      <button class="log-btn" onclick="logCardio()">سجّل الكارديو</button>
    </div>`;
  }
  return html;
}

function renderLoggedList(){
  const list = entriesFor(viewedDate);
  if(!list.length) return '';
  let html = `<div class="section-title">📋 المسجّل اليوم</div><div class="logged-list">`;
  list.forEach((e,i)=>{
    let dataStr = e.cat==='cardio' ? `${e.reps} د · ${e.weight} kcal` : `${e.weight}kg · ${e.reps}×${e.sets} RPE${e.rpe}`;
    html += `<div class="logged-item"><div><div class="li-name">${e.name}</div><div class="li-data">${dataStr}</div></div><div class="li-del" onclick="deleteEntry(${i})">✕</div></div>`;
  });
  html += `</div>`;
  return html;
}

/* ===================== ACTIONS ===================== */
function switchDay(d){ activeDayIndex = d; render(); setTimeout(()=>{ const el=document.querySelector('.day-tab.active'); if(el) el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}); },30); }
function setVariant(exId,v){ variants[exId]=v; save('amr_variants',variants); render(); }
function setDayVal(field,val){
  if(!dayVals[viewedDate]) dayVals[viewedDate]={weight:'',water:0,sauna:'',steps:'',hr:''};
  dayVals[viewedDate][field]=val;
  save('amr_dayvals',dayVals);
}
function toggleCore(id){
  if(!selectedCore[viewedDate]) selectedCore[viewedDate]=[];
  const arr = selectedCore[viewedDate];
  const idx = arr.indexOf(id);
  if(idx>-1) arr.splice(idx,1); else arr.push(id);
  save('amr_selectedcore',selectedCore);
  render();
}
function selectCardio(id){ selectedCardio[viewedDate] = selectedCardio[viewedDate]===id?null:id; render(); }

function findExAnywhere(exId){
  for(const k in EXLIB){ const f = EXLIB[k].find(e=>e.id===exId); if(f) return f; }
  return CORE_POOL.find(e=>e.id===exId);
}

function logExercise(exId, displayName){
  const ex = findExAnywhere(exId);
  const v = variants[exId] || 'main';
  const rpe = document.getElementById('rpe_'+exId).value;
  const kg = document.getElementById('kg_'+exId).value;
  const reps = document.getElementById('reps_'+exId).value;
  const sets = document.getElementById('sets_'+exId).value;
  if(!entries[viewedDate]) entries[viewedDate]=[];
  entries[viewedDate] = entries[viewedDate].filter(e=>!(e.exId===exId && e.variant===v));
  entries[viewedDate].push({exId, name:displayName, variant:v, weight:parseFloat(kg)||0, reps, sets, rpe, cat: ex && CORE_POOL.includes(ex) ? 'core':'strength'});
  save('amr_entries',entries);
  render();
}

function logCardio(){
  const id = selectedCardio[viewedDate];
  const c = CARDIO_TYPES.find(x=>x.id===id);
  const dur = document.getElementById('cardio_dur').value;
  const cal = document.getElementById('cardio_cal').value;
  const lvl = document.getElementById('cardio_lvl').value;
  if(!entries[viewedDate]) entries[viewedDate]=[];
  entries[viewedDate].push({exId:id, name:c.name, variant:'main', weight:parseFloat(cal)||0, reps:dur, sets:lvl, rpe:'', cat:'cardio'});
  save('amr_entries',entries);
  selectedCardio[viewedDate]=null;
  render();
}

function deleteEntry(i){
  entries[viewedDate].splice(i,1);
  save('amr_entries',entries);
  render();
}

/* ===================== SETTINGS MODAL ===================== */
function openSettings(){
  const box = document.getElementById('schedRows');
  let html = '';
  DAY_ORDER.forEach(d=>{
    html += `<div class="sched-row"><div class="dname">${DAY_LABEL[d]}</div>
    <select onchange="schedule['${d}']=this.value; save('amr_schedule',schedule); render();">
      ${Object.keys(TYPE_META).map(k=>`<option value="${k}" ${schedule[d]===k?'selected':''}>${TYPE_META[k].icon} ${TYPE_META[k].name}</option>`).join('')}
    </select></div>`;
  });
  box.innerHTML = html;
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings(){ document.getElementById('settingsModal').classList.remove('open'); }

/* ===================== WEEKLY REPORT ===================== */
function generateReport(){
  const now = new Date();
  const weekAgo = new Date(now); weekAgo.setDate(now.getDate()-6);
  let sessions = new Set(), cardioMin=0, sauna=0, coreCount=0, totalVol=0, water=0, lastWeight='—', lastSteps='0', lastHr='0';
  let lines = [];
  const dateArr = [];
  for(let i=0;i<7;i++){ const d=new Date(weekAgo); d.setDate(weekAgo.getDate()+i); dateArr.push(d.toISOString().slice(0,10)); }

  dateArr.forEach(dateStr=>{
    const dv = dayVals[dateStr];
    if(dv){
      sauna += parseFloat(dv.sauna)||0;
      water += parseFloat(dv.water)||0;
      if(dv.weight) lastWeight = dv.weight;
      if(dv.steps) lastSteps = dv.steps;
      if(dv.hr) lastHr = dv.hr;
    }
    const list = entriesFor(dateStr);
    if(!list.length) return;
    let hasStrength=false;
    list.forEach(e=>{
      if(e.cat==='cardio'){ cardioMin += parseFloat(e.reps)||0; }
      else if(e.cat==='core'){ coreCount++; hasStrength=true; lines.push(`${dateStr}: ${e.name} — ${e.sets}×${e.reps}${e.weight?' @ '+e.weight+'kg':''} (RPE ${e.rpe})`); }
      else { hasStrength=true; totalVol += (parseFloat(e.weight)||0)*(parseFloat(e.reps)||0)*(parseFloat(e.sets)||0); lines.push(`${dateStr}: ${e.name} — ${e.sets}×${e.reps} @ ${e.weight}kg (RPE ${e.rpe})`); }
    });
    if(hasStrength) sessions.add(dateStr);
  });

  const report = `📊 تقرير AMR Fitness
━━━━━━━━━━━━━━━━━━━━
📅 الفترة: ${dateArr[0]} → ${dateArr[6]}

🏋️ الجلسات: ${sessions.size}/4
🚶 الكارديو: ${cardioMin} دقيقة
🧖 السونا: ${sauna} دقيقة
🔥 تمارين البطن: ${coreCount}
💪 الأوزان: ${Math.round(totalVol)} kg
⚖️ الوزن: ${lastWeight} kg
👟 الخطوات: ${lastSteps}
❤️ نبض القلب: ${lastHr}
💧 الماء: ${water} أكواب

📝 التمارين المسجلة:
${lines.join('\n') || '— لا يوجد تمارين مسجلة —'}
━━━━━━━━━━━━━━━━━━━━`;

  document.getElementById('reportBox').innerHTML = `<div class="report-box">${report}</div>
    <button class="copy-btn" onclick="copyReport()">📋 نسخ التقرير</button>`;
  window._lastReport = report;
}
function copyReport(){
  navigator.clipboard.writeText(window._lastReport).then(()=>alert('اتنسخ! ✅'));
}

/* ===================== INIT ===================== */
render();
setTimeout(()=>{ const el=document.querySelector('.day-tab.active'); if(el) el.scrollIntoView({inline:'center',block:'nearest'}); },50);
</script>
</body>
</html>
